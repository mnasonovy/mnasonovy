<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1510"><title>Life RPG</title><style>html,body{margin:0;background:#17120e;color:#f7eee4;font-family:system-ui}#l{min-height:100vh;display:grid;place-items:center;color:#b9aa9b}</style></head><body><div id="l">Загрузка Life RPG…</div><script>(async()=>{try{const a=await Promise.all([0,1,2,3].map(i=>fetch(`p${i}v4.txt`).then(r=>{if(!r.ok)throw new Error('chunk '+i);return r.text()})));const b=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.getElementById('l').textContent='Не удалось запустить приложение: '+e.message}})()</script></body></html>
