name: generate snake animation (new year edition)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation (New Year Theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mnasonovy
          outputs: |
            dist/github-contribution-grid-snake-newyear.svg?color_snake=#FF5555&color_dots=#050814,#004400,#00FF00,#FF0000,#FFD700

      - name: Push generated Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
