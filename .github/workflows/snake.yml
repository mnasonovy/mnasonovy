name: generate snake animation (new year edition)

on:
  schedule:
    - cron: "0 0 * * *" # запускается каждый день
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation (New Year Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: mnasonovy
          outputs: dist/github-contribution-grid-snake-newyear.svg

          # Новогодняя палитра: ёлка, игрушки, гирлянды
          color_snake: "#00FF99"          # неоново-зелёная змейка
          color_dots: "#0B1020,#14324A,#00FF99,#FF5555,#FFD700"
          #            пустая   слабая    средняя  высокая  макс активность
          color_empty: "#0B1020"          # тёмный ночной фон
          color_path: "#FFD700"           # «огоньки гирлянды» за змеёй
          color_border: "#14324A"         # мягкая рамка в холодных тонах
          background: "#050814"           # зимняя ночная тема

      - name: Push generated Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
